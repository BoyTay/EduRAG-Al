<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thanh bên EduRAG</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.nav-item{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;color:#aab6c8;text-decoration:none;font-size:14px;font-weight:600;transition:background .15s,color .15s}
.nav-item:hover{background:rgba(148,163,184,.10);color:#fff}
.nav-item.active{background:rgba(16,185,129,.15);color:#6ee7b7}
.icon-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:#aab6c8;cursor:pointer;transition:background .15s,color .15s;text-decoration:none}
.icon-btn:hover{background:rgba(148,163,184,.14);color:#fff}
.icon-btn.danger:hover{background:rgba(244,63,94,.16);color:#fda4af}
.group-head{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:#8d9bb0;font:inherit;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.group-head:hover{color:#dbe4f0;background:rgba(148,163,184,.08)}
.row{display:flex;align-items:center;gap:8px;width:100%;height:38px;padding:0 10px;border:0;border-radius:10px;background:transparent;color:#c3cddb;font:inherit;font-size:13px;font-weight:500;text-align:left;cursor:pointer}
.row:hover{background:rgba(148,163,184,.10);color:#fff}
.row.active{background:rgba(148,163,184,.16);color:#fff;font-weight:600}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .time{flex:none;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:#8d9bb0}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;background:rgba(148,163,184,.08);border:1px solid rgba(148,163,184,.14);color:#8d9bb0}
.search:focus-within{border-color:#34d399;color:#d1fae5}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#e6edf6;font:inherit;font-size:13px}
.search input::placeholder{color:#8d9bb0}
.new-chat{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:42px;border:0;border-radius:12px;background:#10b981;color:#04261b;font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s}
.new-chat:hover{background:#34d399}
.new-chat:active{transform:scale(.98)}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.3) transparent}
a:focus-visible,button:focus-visible{outline:2px solid #34d399;outline-offset:2px}
</style>
</helmet>
<aside style="width:288px;height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:#0b1329;color:#e6edf6;font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:16px 14px 14px;border-right:1px solid rgba(148,163,184,.14)">

<div style="display:flex;align-items:center;gap:12px;padding:0 2px 0 4px;height:44px">
<div style="width:36px;height:36px;border-radius:11px;background:#10b981;color:#04261b;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5L2 9z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/></svg>
</div>
<div style="flex:1;min-width:0;line-height:1.2">
<div style="display:flex;align-items:center;gap:6px"><span style="font-size:18px;font-weight:800;letter-spacing:-.01em;color:#fff">EduRAG</span><span style="font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(16,185,129,.18);color:#6ee7b7">AI</span></div>
<div style="font-size:12px;color:#8d9bb0;margin-top:2px">Trợ lý học vụ</div>
</div>
<a class="icon-btn" href="Rail.dc.html" aria-label="Thu gọn thanh bên" title="Thu gọn thanh bên">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
</a>
</div>

<div style="margin-top:16px">
<button type="button" class="new-chat">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
Đoạn chat mới
</button>
</div>

<nav aria-label="Điều hướng chính" style="margin-top:14px;display:flex;flex-direction:column;gap:2px">
<a class="nav-item active" href="#chat" aria-current="page">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
<span style="flex:1">Trang chat</span>
</a>
<a class="nav-item" href="#library">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
<span style="flex:1">Thư viện tài liệu</span>
<span style="font-size:11px;font-weight:700;min-width:22px;text-align:center;padding:2px 7px;border-radius:999px;background:rgba(148,163,184,.16);color:#c3cddb">4</span>
</a>
<a class="nav-item" href="#admin">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
<span style="flex:1">Quản trị hệ thống</span>
</a>
</nav>

<div style="height:1px;background:rgba(148,163,184,.14);margin:14px 0 12px"></div>

<label class="search">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<input type="search" placeholder="Tìm lịch sử hội thoại…" aria-label="Tìm lịch sử hội thoại">
</label>

<div class="scroll" style="flex:1;min-height:0;margin-top:10px;margin-right:-6px;padding-right:6px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="margin-bottom:6px">
<button type="button" class="group-head" onClick="{{g.toggle}}" aria-expanded="{{g.open}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{g.chevStyle}}"><path d="M6 9l6 6 6-6"/></svg>
<span style="flex:1;text-align:left">{{g.label}}</span>
<span style="font-size:11px;font-weight:700;letter-spacing:0;color:#8d9bb0">{{g.count}}</span>
</button>
<sc-if value="{{g.open}}" hint-placeholder-val="{{true}}">
<div style="display:flex;flex-direction:column;gap:1px;margin-top:2px">
<sc-for list="{{g.items}}" as="item" hint-placeholder-count="3">
<button type="button" class="row {{item.cls}}" onClick="{{item.pick}}">
<span class="t">{{item.title}}</span>
<span class="time">{{item.time}}</span>
</button>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</div>

<div style="margin-top:10px;padding-top:12px;border-top:1px solid rgba(148,163,184,.14);display:flex;align-items:center;gap:10px">
<div style="position:relative;flex:none">
<div style="width:38px;height:38px;border-radius:12px;background:rgba(16,185,129,.16);color:#6ee7b7;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px">Q</div>
<span style="position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:#34d399;border:2px solid #0b1329"></span>
</div>
<div style="flex:1;min-width:0;line-height:1.25">
<div style="font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Quản trị viên</div>
<div style="font-size:12px;color:#8d9bb0">Đang hoạt động</div>
</div>
<a class="icon-btn" href="#settings" aria-label="Cài đặt tài khoản" title="Cài đặt tài khoản">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
</a>
<button type="button" class="icon-btn danger" aria-label="Đăng xuất" title="Đăng xuất">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M16 8l4 4-4 4M20 12H9"/></svg>
</button>
</div>

</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":288,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { activeId: 'c5', open: { recent: true, sep: false } };
  }
  renderVals() {
    const defs = [
      { id: 'recent', label: '30 ngày qua', count: 6, items: [
        { id: 'c1', title: 'Bạn K có điểm tổng kết học phần bao nhiêu thì đạt', time: '17:16' },
        { id: 'c2', title: 'Bạn A học ngành nào thì cần chuẩn đầu ra', time: '10:39' },
        { id: 'c3', title: 'Chuẩn đầu ra ngoại ngữ cho sinh viên K47', time: '00:17' },
        { id: 'c4', title: 'Điểm A tương ứng thang điểm 4 là bao nhiêu', time: '23:03' },
        { id: 'c5', title: 'Điều kiện xét tốt nghiệp', time: '22:36' },
        { id: 'c6', title: 'Điều kiện nhận học bổng', time: '22:16' }
      ]},
      { id: 'sep', label: 'Tháng 9/2026', count: 24, items: [
        { id: 'c7', title: 'Chứng chỉ TOEIC có được miễn học phần ngoại ngữ', time: '21:59' }
      ]}
    ];
    const groups = defs.map((g) => {
      const open = !!this.state.open[g.id];
      return {
        id: g.id,
        label: g.label,
        count: g.count,
        open,
        toggle: () => this.setState({ open: { ...this.state.open, [g.id]: !open } }),
        chevStyle: 'flex:none;transition:transform .15s;transform:' + (open ? 'none' : 'rotate(-90deg)'),
        items: g.items.map((it) => ({
          ...it,
          cls: it.id === this.state.activeId ? 'active' : '',
          pick: () => this.setState({ activeId: it.id })
        }))
      };
    });
    return { groups };
  }
}
</script>
</body>
</html>
