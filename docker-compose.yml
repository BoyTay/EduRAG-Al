# docker-compose.yml - Chạy EduRAG trên local với Docker
# Yêu cầu: Ollama đang chạy trên host machine

services:

  # ── Backend (FastAPI) ──────────────────────────────────────────────
  backend:
    image: edurag_backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: edurag_backend
    ports:
      - "8000:8000"
    volumes:
      # Persist data và chroma_db
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./chat_history.db:/app/chat_history.db
      # Cache embedding model để không phải tải lại mỗi lần khởi động
      - hf_cache:/root/.cache/huggingface
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LLM_MODEL=qwen2.5:7b
      - EMBEDDING_MODEL=AITeamVN/Vietnamese_Embedding
      - CHROMA_PATH=/app/chroma_db
      - DATA_PATH=/app/data
      - CHUNK_SIZE=700
      - CHUNK_OVERLAP=150
      - TOP_K=5
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
    extra_hosts:
      # Cho phép container truy cập host machine (Ollama)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 240s

  # ── Frontend (React + Vite build served by Nginx) ───────────────────
  frontend:
    image: edurag_frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # This URL is used by the browser, not by the Docker network.
        VITE_API_URL: http://localhost:8000
    container_name: edurag_frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hf_cache:
    name: edurag_hf_cache

networks:
  default:
    name: edurag_default
